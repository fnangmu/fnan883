<p>
Branch from <span class="texttt">main</span>, put your slides in
<span class="texttt">presentations/&lt;your-name&gt;/</span>, append one line to
<span class="texttt">presentations.js</span>, then merge. Full instructions are in

<script src="presentations.js"></script>
<script>
(function () {
  var table = document.getElementById('presentation-table');
  var items = (window.PRESENTATIONS || []).slice();

  if (!items.length) {
    table.parentNode.replaceChild(
      Object.assign(document.createElement('p'), { textContent: 'No presentations registered yet.' }),
      table
    );
    return;
  }

  // Chronological, matching the order of the seminar.
  items.sort(function (a, b) { return String(a.date || '').localeCompare(String(b.date || '')); });

  items.forEach(function (p) {
    var row = table.insertRow();

    var when = row.insertCell();
    when.className = 'tdb';
    when.textContent = p.date || '';

    var who = row.insertCell();
    who.className = 'tdb';
    who.textContent = p.presenter || 'Unattributed';

    var what = row.insertCell();
    what.className = 'tdp';

    var para = document.createElement('p');
    var link = document.createElement('a');
    // Slug becomes a path segment, so keep it to safe characters.
    link.href = String(p.slug || '').replace(/[^A-Za-z0-9._-]/g, '') + '/';
    link.textContent = p.title || 'Untitled';
    para.appendChild(link);

    if (p.authors) {
      para.appendChild(document.createElement('br'));
      para.appendChild(document.createTextNode(p.authors));
    }
    if (p.source) {
      para.appendChild(document.createElement('br'));
      var cite = document.createElement('em');
      cite.textContent = p.source;
      para.appendChild(cite);
    }

    what.appendChild(para);
  });
})();
</script>
